app = "dusel-bot"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"

# No [[services]] — this is a worker, no HTTP server needed

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "dusel_data"
  destination = "/data"
